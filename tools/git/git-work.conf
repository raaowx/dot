# Professional identity template.
#
# Copy to ~/.gitconfig-work ON THE WORK MACHINE ONLY and fill in the values.
#
# It is pulled in by the `includeIf "gitdir:~/Developer/"` block at the end of
# git.conf, so every repository under ~/Developer/ overrides the personal
# identity with the one set here.
#
# On the personal machine this file must NOT exist in ~: git silently ignores an
# `include.path` pointing at a missing file, so ~/Developer/ keeps inheriting the
# personal identity from git.conf. That is what allows a single git.conf to be
# copied verbatim to both machines.
#
# Never commit the real values: this repository is public.

[user]
	name = <PROFESSIONAL_NAME>
	email = <PROFESSIONAL_EMAIL>
